function genCode(){

    const chars =
    "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

    let s="";

    for(let i=0;i<8;i++){

        if(i===4){
            s+="-";
        }

        s += chars[
            Math.floor(
                Math.random()*chars.length
            )
        ];
    }

    return "EF-"+s;
}


function getYoutubeEmbed(url){

    if(!url){
        return "";
    }

    const match =
    url.match(
        /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([\w-]{11})/
    );

    if(!match){
        return url;
    }

    return (
        "https://www.youtube.com/embed/" +
        match[1]
    );
}

/* =====================================================
   SIGNUP
===================================================== */

function Signup({
    go,
    onDone
}){

    const [name,setName]=useState("");
    const [email,setEmail]=useState("");
    const [studentNumber,setStudentNumber]=useState("");
    const [parentNumber,setParentNumber]=useState("");
    const [password,setPassword]=useState("");

    const [loading,setLoading]=useState(false);
    const [error,setError]=useState("");
    const [success,setSuccess]=useState("");


    async function submit(){

        setError("");
        setSuccess("");

        if(
            name.trim().split(/\s+/).length < 3
        ){
            setError("اكتب الاسم الثلاثي كاملًا");
            return;
        }

        if(
            !email.trim() ||
            !studentNumber.trim() ||
            !parentNumber.trim() ||
            !password
        ){
            setError("املأ كل البيانات");
            return;
        }

        if(password.length < 6){

            setError(
                "الباسورد لازم يكون 6 حروف أو أرقام على الأقل"
            );

            return;
        }

        setLoading(true);

        try{

            const {
                data:authData,
                error:authError
            } =
            await supabase.auth.signUp({
                email:email.trim(),
                password:password
            });

            if(authError){
                throw authError;
            }

            if(!authData.user){

                throw new Error(
                    "لم يتم إنشاء الحساب"
                );

            }

            const {
                error:studentError
            } =
            await supabase
            .from("students")
            .insert({

                id:authData.user.id,

                full_name:name.trim(),

                student_number:
                studentNumber.trim(),

                parent_number:
                parentNumber.trim(),

                student_code:
                genCode(),

                email:
                email.trim()

            });

            if(studentError){
                throw studentError;
            }

            if(authData.session){

                onDone(authData.user);

            }else{

                setSuccess(
                    "تم إنشاء الحساب بنجاح. افتح رسالة تأكيد الإيميل ثم سجل الدخول."
                );

            }

        }catch(e){

            setError(
                e.message ||
                "حصل خطأ أثناء إنشاء الحساب"
            );

        }finally{

            setLoading(false);

        }

    }


    return(

        <div className="max-w-md mx-auto px-5 py-12">

            <h2
                className="text-3xl font-extrabold text-center font-cairo mb-7"
            >
                حساب جديد
            </h2>

            <div
                className="rounded-2xl p-6"
                style={{
                    background:"#FDFBF4",
                    border:"1px solid rgba(22,48,42,.12)"
                }}
            >

                <Field
                    label="الاسم الثلاثي"
                    value={name}
                    onChange={e=>setName(e.target.value)}
                    placeholder="مثال: أحمد محمد علي"
                />

                <Field
                    label="الإيميل"
                    type="email"
                    value={email}
                    onChange={e=>setEmail(e.target.value)}
                    placeholder="example@gmail.com"
                />

                <Field
                    label="رقم الطالب"
                    value={studentNumber}
                    onChange={e=>setStudentNumber(e.target.value)}
                />

                <Field
                    label="رقم ولي الأمر"
                    value={parentNumber}
                    onChange={e=>setParentNumber(e.target.value)}
                />

                <Field
                    label="الباسورد"
                    type="password"
                    value={password}
                    onChange={e=>setPassword(e.target.value)}
                />

                {error && (

                    <p
                        className="text-sm font-bold mb-4"
                        style={{
                            color:"#E85C41"
                        }}

                        {error}
                    </p>

                )}

                {success && (

                    <p
                        className="text-sm font-bold mb-4"
                        style={{
                            color:"#4C8C63"
                        }}

                        {success}
                    </p>

                )}

                <Button

function Login({

    const [resetMessage,setResetMessage]=useState("");


    async function submit(){

        setError("");

        if(!email.trim() || !password){

            setError(
                "اكتب الإيميل والباسورد"
            );

            return;
        }

        setLoading(true);

        const {
            data,
            error
        } =
        await supabase.auth.signInWithPassword({

            email:email.trim(),

            password

        });

        setLoading(false);

        if(error){

            setError(
                "الإيميل أو الباسورد غير صحيح"
            );

            return;
        }

        onDone(data.user);

    }

        setResetMessage("");

            setResetMessage(
                "اكتب الإيميل الأول"

            resetEmail.trim(),

/* =====================================================
   UPDATE PASSWORD
===================================================== */

function UpdatePassword({
    onDone
}){

    const [password,setPassword]=useState("");
    const [confirm,setConfirm]=useState("");

    const [error,setError]=useState("");
    const [success,setSuccess]=useState("");
    const [loading,setLoading]=useState(false);


    async function update(){

        setError("");
        setSuccess("");

        if(password.length < 6){

            setError(
                "الباسورد لازم يكون 6 حروف أو أرقام على الأقل"
            );

            return;
        }

        if(password !== confirm){

            setError(
                "الباسورد وتأكيد الباسورد غير متطابقين"
            );

            return;
        }

        setLoading(true);

        const {
            error
        } =
        await supabase.auth.updateUser({
            password
        });

        setLoading(false);

        if(error){

            setError(error.message);

            return;
        }

        setSuccess(
            "تم تغيير الباسورد بنجاح ✓"
        );

        setTimeout(
            ()=>onDone(),
            1200
        );

    }


    return(

        <div className="max-w-md mx-auto px-5 py-14">

            <h2
                className="text-3xl font-extrabold text-center font-cairo mb-7"
            >
                تغيير الباسورد
            </h2>

            <div
                className="rounded-2xl p-6"
                style={{
                    background:"#FDFBF4",
                    border:"1px solid rgba(22,48,42,.12)"
                }}
            >

                <Field
                    label="الباسورد الجديد"
                    type="password"
                    value={password}
                    onChange={e=>
                        setPassword(e.target.value)
                    }
                />

                <Field
                    label="تأكيد الباسورد"
                    type="password"
                    value={confirm}
                    onChange={e=>
                        setConfirm(e.target.value)
                    }
                />

                {error && (

                    <p
                        className="text-sm font-bold mb-4"
                        style={{
                            color:"#E85C41"
                        }}
                    >
                        {error}
                    </p>

                )}

                {success && (

                    <p
                        className="text-sm font-bold mb-4"
                        style={{
                            color:"#4C8C63"
                        }}
                    >
                        {success}
                    </p>

                )}

                <Button
                    className="w-full"
                    disabled={loading}
                    onClick={update}
                >
                    {loading
                        ? "جاري تغيير الباسورد..."
                        : "تغيير الباسورد"
                    }
                </Button>

            </div>

        </div>

    );
}


/* =====================================================
   STUDENT DASHBOARD
===================================================== */

function StudentDashboard({
    student,
    lessons,
    access,
    onRefresh
}){

    const [codes,setCodes]=useState({});
    const [message,setMessage]=useState("");
    const [active,setActive]=useState(null);


    async function redeem(lesson){

        setMessage("");

        const value =
        (codes[lesson.id] || "")
        .trim()
        .toUpperCase();

        if(!value){

            setMessage("اكتب الكود أولًا");

            return;
        }

        const {
            data:found,
            error
        } =
        await supabase
        .from("lesson_codes")
        .select("*")
        .eq("code",value)
        .eq("lesson_id",lesson.id)
        .eq("used",false)
        .maybeSingle();

        if(error || !found){

            setMessage(
                "الكود غير صحيح أو مستخدم"
            );

            return;
        }


        const {
            error:updateError
        } =
        await supabase
        .from("lesson_codes")
        .update({
            used:true,
            used_by:student.id
        })
        .eq("id",found.id)
        .eq("used",false);

        if(updateError){

            setMessage(
                "حصل خطأ، حاول مرة تانية"
            );

            return;
        }


        const {
            error:accessError
        } =
        await supabase
        .from("lesson_access")
        .upsert({

            student_id:student.id,

            lesson_id:lesson.id,

            status:"unlocked"

        },{
            onConflict:
            "student_id,lesson_id"
        });


        if(accessError){

            setMessage(
                "الكود اتقبل لكن حصل خطأ في فتح الحصة."
            );

            return;
        }


        setMessage(
            "تم فتح الحصة ✓"
        );

        setCodes({
            ...codes,
            [lesson.id]:""
        });

        await onRefresh();

    }


    async function complete(lesson){

        const {error} =
        await supabase
        .from("lesson_access")
        .update({
            status:"completed"
        })
        .eq("student_id",student.id)
        .eq("lesson_id",lesson.id);

        if(error){

            setMessage(
                "حصل خطأ أثناء تسجيل إتمام الحصة."
            );

            return;
        }

        await onRefresh();

    }


    if(active){

        const item =
        access.find(
            x=>x.lesson_id===active.id
        );

        return(

            <div className="max-w-4xl mx-auto px-5 py-10">

                <button
                    onClick={()=>setActive(null)}
                    className="mb-6 font-bold"
                >
                    ← رجوع
                </button>

                <div
                    className="rounded-2xl p-6 mb-5"
                    style={{
                        background:"#16302A"
                    }}
                >

                    <h2
                        className="text-2xl font-extrabold text-white font-cairo"
                    >
                        {active.title}
                    </h2>

                    <p
                        className="text-white/70 mt-2"
                    >
                        {active.description}
                    </p>

                </div>

                <div
                    className="rounded-2xl overflow-hidden"
                    style={{
                        background:"#FDFBF4"
                    }}
                >

                    {active.video_url ? (

                        <div
                            className="relative"
                            style={{
                                paddingTop:"56.25%"
                            }}
                        >

                            <iframe
                                className="absolute inset-0 w-full h-full"
                                src={getYoutubeEmbed(
                                    active.video_url
                                )}
                                title={active.title}
                                allowFullScreen
                            />

                        </div>

                    ) : (

                        <div className="p-10 text-center font-bold">
                            محتوى الحصة هيتضاف قريبًا من الأستاذ.
                        </div>

                    )}

                </div>

                {item?.status !== "completed" && (

                    <div className="mt-6">

                        <Button
                            variant="accent"
                            onClick={()=>
                                complete(active)
                            }
                        >
                            ✅ أنهيت الحصة
                        </Button>

                    </div>

                )}

            </div>

        );
    }


    return(

        <div className="max-w-4xl mx-auto px-5 py-10">

            <h2
                className="text-3xl font-extrabold font-cairo"
            >
                أهلاً {student.full_name.split(" ")[0]} 👋
            </h2>

            <p
                className="mt-2 mb-8"
                style={{
                    color:"#6B675C"
                }}
            >
                كود الطالب:
                {" "}
                <b>
                    {student.student_code}
                </b>
            </p>

            {message && (

                <div
                    className="rounded-xl p-3 mb-5 font-bold"
                    style={{
                        background:"#FDFBF4",
                        border:
                        "1px solid rgba(22,48,42,.15)"
                    }}
                >
                    {message}
                </div>

            )}

            <div className="grid gap-4">

                {lessons.map(lesson=>{

                    const item =
                    access.find(
                        x=>x.lesson_id===lesson.id
                    );

                    const status =
                    item?.status || "locked";

                    return(

                        <div
                            key={lesson.id}
                            className="rounded-2xl p-5"
                            style={{
                                background:"#FDFBF4",
                                border:
                                "1px solid rgba(22,48,42,.12)"
                            }}
                        >

                            <h3
                                className="text-lg font-bold font-cairo"
                            >
                                {status==="locked"
                                    ? "🔒"
                                    : status==="completed"
                                    ? "✅"
                                    : "🔓"
                                }
                                {" "}
                                {lesson.title}
                            </h3>

                            <p
                                className="text-sm mt-1"
                                style={{
                                    color:"#6B675C"
                                }}
                            >
                                {lesson.description}
                            </p>

                            {status==="locked" && (

                                <div
                                    className="flex gap-2 mt-4"
                                >

                                    <input
                                        value={
                                            codes[lesson.id] || ""
                                        }
                                        onChange={e=>
                                            setCodes({
                                                ...codes,
                                                [lesson.id]:
                                                e.target.value
                                            })
                                        }
                                        placeholder="كود الحصة"
                                        className="flex-1 rounded-xl px-4 py-2 outline-none"
                                        style={{
                                            background:"#F7F3E8",
                                            border:
                                            "1px solid rgba(22,48,42,.2)"
                                        }}
                                    />

                                    <Button
                                        variant="accent"
                                        onClick={()=>
                                            redeem(lesson)
                                        }
                                    >
                                        🔑 فتح
                                    </Button>

                                </div>

                            )}

                            {(status==="unlocked" ||
                              status==="completed") && (

                                <div className="mt-4">

                                    <Button
                                        onClick={()=>
                                            setActive(lesson)
                                        }
                                    >
                                        ▶ دخول الحصة
                                    </Button>

                                </div>

                            )}

                        </div>

                    );

                })}

                {lessons.length===0 && (

                    <p className="text-center font-bold py-10">
                        مفيش حصص مضافة حاليًا.
                    </p>

                )}

            </div>

        </div>

    );
}


/* =====================================================
   ADMIN DASHBOARD
===================================================== */

function AdminDashboard({
    lessons,
    onRefresh
}){

    const [title,setTitle]=useState("");
    const [description,setDescription]=useState("");
    const [video,setVideo]=useState("");

    const [codes,setCodes]=useState(10);
    const [selected,setSelected]=useState("");

    const [students,setStudents]=useState([]);
    const [allAccess,setAllAccess]=useState([]);

    const [message,setMessage]=useState("");
    const [loadingStudents,setLoadingStudents]=useState(false);

    const [settings,setSettings]=useState({

        title:"English Elfishawy",

        subtitle:
        "اتعلم English بطريقة أذكى",

        description:
        "دروس اللغة الإنجليزية الخاصة بـ Mr. Mostafa Elfishawy",

        phone:"01000000000"

    });

    const [settingsLoading,setSettingsLoading]=
    useState(false);


    async function loadStudents(){

        setLoadingStudents(true);

        const {
            data,
            error
        } =
        await supabase
        .from("students")
        .select("*")
        .order(
            "created_at",
            {ascending:false}
        );

        if(error){

            setMessage(
                "خطأ في تحميل الطلاب: "+
                error.message
            );

        }else{

            setStudents(data || []);

        }


        const {
            data:accessData
        } =
        await supabase
        .from("lesson_access")
        .select("*");

        setAllAccess(
            accessData || []
        );

        setLoadingStudents(false);

    }


    async function loadSettings(){

        const {
            data,
            error
        } =
        await supabase
        .from("platform_store")
        .select("content")
        .eq("id",1)
        .maybeSingle();

        if(
            !error &&
            data?.content
        ){

            setSettings(prev=>({
                ...prev,
                ...data.content
            }));

        }

    }


    useEffect(()=>{

        loadStudents();
        loadSettings();

    },[]);


    async function addLesson(){

        setMessage("");

        if(!title.trim()){

            setMessage(
                "اكتب عنوان الحصة"
            );

            return;
        }

        const {
            error
        } =
        await supabase
        .from("lessons")
        .insert({

            title:title.trim(),

            description:
            description.trim(),

            video_url:
            video.trim()

        });

        if(error){

            setMessage(
                "حصل خطأ أثناء إضافة الحصة: "+
                error.message
            );

            return;
        }

        setTitle("");
        setDescription("");
        setVideo("");

        setMessage(
            "تمت إضافة الحصة ✓"
        );

        await onRefresh();

    }


    async function deleteLesson(id){

        if(!confirm(
            "هل أنت متأكد من حذف هذه الحصة؟"
        )){
            return;
        }

        const {
            error
        } =
        await supabase
        .from("lessons")
        .delete()
        .eq("id",id);

        if(error){

            alert(
                "حصل خطأ أثناء الحذف: "+
                error.message
            );

            return;
        }

        await onRefresh();
        await loadStudents();

    }


    async function generateCodes(){

        if(!selected){

            alert(
                "اختار الحصة الأول"
            );

            return;
        }

        const amount =
        Math.min(
            100,
            Math.max(
                1,
                Number(codes) || 1
            )
        );

        const rows=[];

        for(let i=0;i<amount;i++){

            rows.push({

                code:genCode(),

                lesson_id:selected,

                used:false

            });

        }

        const {
            error
        } =
        await supabase
        .from("lesson_codes")
        .insert(rows);

        if(error){

            alert(
                "حصل خطأ أثناء إنشاء الأكواد: "+
                error.message
            );

            return;
        }

        alert(
            "تم إنشاء "+
            amount+
            " كود ✓"
        );

    }


    async function openLesson(
        studentId,
        lessonId
    ){

        const {
            error
        } =
        await supabase
        .from("lesson_access")
        .upsert({

            student_id:studentId,

            lesson_id:lessonId,

            status:"unlocked"

        },{
            onConflict:
            "student_id,lesson_id"
        });

        if(error){

            alert(
                "حصل خطأ: "+
                error.message
            );

            return;
        }

        await loadStudents();

    }


    async function closeLesson(
        studentId,
        lessonId
    ){

        const {
            error
        } =
        await supabase
        .from("lesson_access")
        .upsert({

            student_id:studentId,

            lesson_id:lessonId,

            status:"locked"

        },{
            onConflict:
            "student_id,lesson_id"
        });

        if(error){

            alert(
                "حصل خطأ: "+
                error.message
            );

            return;
        }

        await loadStudents();

    }


    async function saveSettings(){

        setSettingsLoading(true);

        const {
            error
        } =
        await supabase
        .from("platform_store")
        .upsert({

            id:1,

            content:settings

        });

        setSettingsLoading(false);

        if(error){

            setMessage(
                "حصل خطأ في حفظ الإعدادات: "+
                error.message
            );

            return;
        }

        setMessage(
            "تم حفظ إعدادات المنصة ✓"
        );

    }


    return(

        <div className="max-w-6xl mx-auto px-5 py-10">

            <h2
                className="text-3xl font-extrabold font-cairo mb-8"
            >
                لوحة تحكم الأدمن ⚙️
            </h2>


            {message && (

                <div
                    className="rounded-xl p-4 mb-6 font-bold"
                    style={{
                        background:"#FDFBF4",
                        border:
                        "1px solid rgba(22,48,42,.15)"
                    }}
                >
                    {message}
                </div>

            )}


            {/* SETTINGS */}

            <div
                className="rounded-2xl p-6 mb-8"
                style={{
                    background:"#FDFBF4",
                    border:
                    "1px solid rgba(22,48,42,.12)"
                }}
            >

                <h3 className="text-xl font-bold mb-5">
                    ⚙️ إعدادات المنصة
                </h3>

                <Field
                    label="اسم المنصة"
                    value={settings.title}
                    onChange={e=>
                        setSettings({
                            ...settings,
                            title:e.target.value
                        })
                    }
                />

                <Field
                    label="العنوان الرئيسي"
                    value={settings.subtitle}
                    onChange={e=>
                        setSettings({
                            ...settings,
                            subtitle:e.target.value
                        })
                    }
                />

                <Field
                    label="الوصف"
                    value={settings.description}
                    onChange={e=>
                        setSettings({
                            ...settings,
                            description:e.target.value
                        })
                    }
                />

                <Field
                    label="رقم التواصل"
                    value={settings.phone}
                    onChange={e=>
                        setSettings({
                            ...settings,
                            phone:e.target.value
                        })
                    }
                />

                <Button
                    variant="accent"
                    disabled={settingsLoading}
                    onClick={saveSettings}
                >
                    {settingsLoading
                        ? "جاري الحفظ..."
                        : "💾 حفظ الإعدادات"
                    }
                </Button>

            </div>


            {/* STUDENTS */}

            <div
                className="rounded-2xl p-6 mb-8"
                style={{
                    background:"#FDFBF4",
                    border:
                    "1px solid rgba(22,48,42,.12)"
                }}
            >

                <div
                    className="flex justify-between items-center mb-5"
                >

                    <h3 className="text-xl font-bold">
                        👨‍🎓 الطلاب
                    </h3>

                    <Button
                        variant="outline"
                        onClick={loadStudents}
                    >
                        🔄 تحديث
                    </Button>

                </div>


                {loadingStudents ? (

                    <p className="font-bold">
                        جاري تحميل الطلاب...
                    </p>

                ) : students.length===0 ? (

                    <p className="font-bold">
                        لا يوجد طلاب مسجلين حتى الآن.
                    </p>

                ) : (

                    <div className="grid gap-4">

                        {students.map(student=>(

                            <div
                                key={student.id}
                                className="rounded-2xl p-5"
                                style={{
                                    background:"#EEF0EA",
                                    border:
                                    "1px solid rgba(22,48,42,.1)"
                                }}
                            >

                                <div className="mb-4">

                                    <p className="font-bold text-lg">
                                        {student.full_name}
                                    </p>

                                    <p className="text-sm">
                                        📧 {student.email}
                                    </p>

                                    <p className="text-sm">
                                        🎓 رقم الطالب:
                                        {" "}
                                        {student.student_number}
                                    </p>

                                    <p className="text-sm">
                                        📞 ولي الأمر:
                                        {" "}
                                        {student.parent_number}
                                    </p>

                                    <p className="text-sm">
                                        🔑 كود الطالب:
                                        {" "}
                                        {student.student_code}
                                    </p>

                                </div>


                                <div className="grid gap-3">

                                    {lessons.map(lesson=>{

                                        const item =
                                        allAccess.find(
                                            x=>
                                            x.student_id===
                                            student.id &&
                                            x.lesson_id===
                                            lesson.id
                                        );

                                        const status =
                                        item?.status ||
                                        "locked";

                                        return(

                                            <div
                                                key={lesson.id}
                                                className="rounded-xl p-4 flex flex-col md:flex-row md:items-center justify-between gap-3"
                                                style={{
                                                    background:"#FDFBF4"
                                                }}
                                            >

                                                <div>

                                                    <p className="font-bold">
                                                        {lesson.title}
                                                    </p>

                                                    <p
                                                        className="text-sm"
                                                        style={{
                                                            color:
                                                            status==="unlocked"
                                                            ? "#4C8C63"
                                                            : status==="completed"
                                                            ? "#3E6E8E"
                                                            : "#E85C41"
                                                        }}
                                                    >
                                                        {status==="unlocked"
                                                        ? "🔓 مفتوحة"
                                                        : status==="completed"
                                                        ? "✅ مكتملة"
                                                        : "🔒 مقفولة"
                                                        }
                                                    </p>

                                                </div>


                                                <div className="flex gap-2">

                                                    <Button
                                                        variant="accent"
                                                        onClick={()=>
                                                            openLesson(
                                                                student.id,
                                                                lesson.id
                                                            )
                                                        }
                                                    >
                                                        🔓 فتح
                                                    </Button>

                                                    <Button
                                                        variant="danger"
                                                        onClick={()=>
                                                            closeLesson(
                                                                student.id,
                                                                lesson.id
                                                            )
                                                        }
                                                    >
                                                        🔒 قفل
                                                    </Button>

                                                </div>

                                            </div>

                                        );

                                    })}

                                </div>

                            </div>

                        ))}

                    </div>

                )}

            </div>


            {/* ADD LESSON */}

            <div
                className="rounded-2xl p-6 mb-8"
                style={{
                    background:"#FDFBF4",
                    border:
                    "1px solid rgba(22,48,42,.12)"
                }}
            >

                <h3 className="text-xl font-bold mb-5">
                    ➕ إضافة حصة
                </h3>

                <Field
                    label="عنوان الحصة"
                    value={title}
                    onChange={e=>
                        setTitle(e.target.value)
                    }
                    placeholder="Present Simple"
                />

                <Field
                    label="الوصف"
                    value={description}
                    onChange={e=>
                        setDescription(e.target.value)
                    }
                />

                <Field
                    label="رابط الفيديو"
                    value={video}
                    onChange={e=>
                        setVideo(e.target.value)
                    }
                    placeholder="https://www.youtube.com/watch?v=..."
                />

                <Button
                    onClick={addLesson}
                >
                    ➕ إضافة الحصة
                </Button>

            </div>


            {/* CODES */}

            <div
                className="rounded-2xl p-6 mb-8"
                style={{
                    background:"#FDFBF4",
                    border:
                    "1px solid rgba(22,48,42,.12)"
                }}
            >

                <h3 className="text-xl font-bold mb-5">
                    🎟️ إنشاء أكواد
                </h3>

                <select
                    value={selected}
                    onChange={e=>
                        setSelected(e.target.value)
                    }
                    className="w-full rounded-xl px-4 py-3 mb-4"
                    style={{
                        border:
                        "1px solid rgba(22,48,42,.2)",
                        background:"#FDFBF4"
                    }}
                >

                    <option value="">
                        اختر الحصة
                    </option>

                    {lessons.map(l=>(

                        <option
                            key={l.id}
                            value={l.id}
                        >
                            {l.title}
                        </option>

                    ))}

                </select>

                <Field
                    label="عدد الأكواد"
                    type="number"
                    min="1"
                    max="100"
                    value={codes}
                    onChange={e=>
                        setCodes(e.target.value)
                    }
                />

                <Button
                    variant="accent"
                    onClick={generateCodes}
                >
                    🎲 إنشاء الأكواد
                </Button>

            </div>


            {/* LESSONS */}

            <div>

                <h3 className="text-xl font-bold mb-4">
                    📚 الحصص الحالية
                </h3>

                <div className="grid gap-3">

                    {lessons.map(l=>(

                        <div
                            key={l.id}
                            className="rounded-xl p-4 flex justify-between items-center gap-3"
                            style={{
                                background:"#FDFBF4",
                                border:
                                "1px solid rgba(22,48,42,.12)"
                            }}
                        >

                            <div>

                                <p className="font-bold">
                                    {l.title}
                                </p>

                                <p
                                    className="text-sm"
                                    style={{
                                        color:"#6B675C"
                                    }}
                                >
                                    {l.description}
                                </p>

                            </div>

                            <button
                                onClick={()=>
                                    deleteLesson(l.id)
                                }
                                className="font-bold"
                                style={{
                                    color:"#E85C41"
                                }}
                            >
                                حذف 🗑️
                            </button>

                        </div>

                    ))}

                </div>

            </div>

        </div>

    );

}


/* =====================================================
   APP
===================================================== */

function App(){

    const [page,setPage]=useState("home");

    const [user,setUser]=useState(null);
    const [student,setStudent]=useState(null);

    const [lessons,setLessons]=useState([]);
    const [access,setAccess]=useState([]);

    const [loading,setLoading]=useState(true);

    const [admin,setAdmin]=useState(false);

    const [changingPassword,setChangingPassword]=
    useState(false);


    async function loadData(currentUser){

        const {
            data:lessonData,
            error:lessonError
        } =
        await supabase
        .from("lessons")
        .select("*")
        .order(
            "created_at",
            {ascending:true}
        );

        if(!lessonError){

            setLessons(
                lessonData || []
            );

        }


        if(currentUser){

            const {
                data:studentData
            } =
            await supabase
            .from("students")
            .select("*")
            .eq(
                "id",
                currentUser.id
            )
            .maybeSingle();

            setStudent(
                studentData || null
            );


            const {
                data:accessData
            } =
            await supabase
            .from("lesson_access")
            .select("*")
            .eq(
                "student_id",
                currentUser.id
            );

            setAccess(
                accessData || []
            );

        }else{

            setStudent(null);
            setAccess([]);

        }

    }


    async function refresh(){

        await loadData(user);

    }


    async function loginDone(u){

        setUser(u);

        const isAdmin =
        u?.email?.toLowerCase() ===
        ADMIN_EMAIL.toLowerCase();

        setAdmin(isAdmin);

        if(isAdmin){

            setPage("admin");

        }else{

            setPage("student");

        }

        await loadData(u);

    }


    async function logout(){

        await supabase.auth.signOut();

        setUser(null);
        setStudent(null);
        setAdmin(false);
        setChangingPassword(false);
        setPage("home");

    }


    useEffect(()=>{

        let mounted=true;


        async function start(){

            const {
                data:{session}
            } =
            await supabase.auth.getSession();


            if(!mounted){
                return;
            }


            if(session?.user){

                setUser(session.user);

                const isAdmin =
                session.user.email?.toLowerCase() ===
                ADMIN_EMAIL.toLowerCase();

                setAdmin(isAdmin);

                if(isAdmin){

                    setPage("admin");

                }else{

                    setPage("student");

                }

                await loadData(
                    session.user
                );

            }else{

                await loadData(null);

            }


            if(mounted){

                setLoading(false);

            }

        }


        start();


        const {
            data:{subscription}
        } =
        supabase.auth.onAuthStateChange(
            async(event,session)=>{

                if(!mounted){
                    return;
                }


                if(
                    event ===
                    "PASSWORD_RECOVERY"
                ){

                    setChangingPassword(true);

                    setPage("password");

                    setLoading(false);

                    return;
                }


                if(session?.user){

                    setUser(session.user);

                    const isAdmin =
                    session.user.email?.toLowerCase() ===
                    ADMIN_EMAIL.toLowerCase();

                    setAdmin(isAdmin);


                    if(!changingPassword){

                        if(isAdmin){

                            setPage("admin");

                        }else{

                            setPage("student");

                        }

                    }

                    await loadData(
                        session.user
                    );

                }else{

                    setUser(null);
                    setStudent(null);
                    setAdmin(false);

                    if(event==="SIGNED_OUT"){

                        setPage("home");

                    }

                }

            }
        );


        return()=>{

            mounted=false;

            subscription.unsubscribe();

        };

    },[]);


    function passwordUpdated(){

        setChangingPassword(false);

        setPage("login");

        setUser(null);

        setAdmin(false);

        setStudent(null);

        supabase.auth.signOut();

    }


    if(loading){

        return(

            <div
                className="min-h-screen flex items-center justify-center font-bold text-lg"
                style={{
                    background:"#EEF0EA",
                    color:"#16302A"
                }}
            >
                جاري تحميل المنصة...
            </div>

        );

    }


    return(

        <div className="min-h-screen">

            <Header
                user={user}
                onLogout={logout}
                onHome={()=>setPage("home")}
            />


            {page==="home" && (

                <Landing
                    go={setPage}
                />

            )}


            {page==="signup" && (

                <Signup
                    go={setPage}
                    onDone={loginDone}
                />

            )}


            {page==="login" && (

                <Login
                    go={setPage}
                    onDone={loginDone}
                />

            )}


            {page==="password" && (

                <UpdatePassword
                    onDone={passwordUpdated}
                />

            )}


            {page==="student" &&
             user &&
             !admin &&
             student && (

                <StudentDashboard
                    student={student}
                    lessons={lessons}
                    access={access}
                    onRefresh={refresh}
                />

            )}


            {page==="student" &&
             user &&
             !admin &&
             !student && (

                <div
                    className="max-w-md mx-auto px-5 py-20 text-center"
                >

                    <h2
                        className="text-2xl font-bold font-cairo mb-3"
                    >
                        الحساب موجود لكن بيانات الطالب ناقصة
                    </h2>

                    <p>
                        تواصلي مع الإدارة لإكمال بيانات الحساب.
                    </p>

                </div>

            )}


            {page==="admin" &&
             user &&
             admin && (

                <AdminDashboard
                    lessons={lessons}
                    onRefresh={refresh}
                />

            )}


            <footer
                className="text-center py-10 text-sm font-bold"
                style={{
                    color:"#6B675C"
                }}
            >
                English Elfishawy © 2026
            </footer>

        </div>

    );

}


/* =====================================================
   START
===================================================== */

ReactDOM
.createRoot(
    document.getElementById("root")
)
.render(
    <App/>
);

</script>
