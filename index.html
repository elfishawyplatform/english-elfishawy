function genCode(){

    const chars =
    "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

    let result="";

    for(let i=0;i<8;i++){

        if(i===4)
            result+="-";

        result +=
        chars[Math.floor(Math.random()*chars.length)];
    }

    return "EF-"+result;
}

function Signup({navigate}){

    const [name,setName]=useState("");
    const [email,setEmail]=useState("");
    const [studentNumber,setStudentNumber]=useState("");
    const [parentNumber,setParentNumber]=useState("");
    const [password,setPassword]=useState("");

    const [error,setError]=useState("");
    const [loading,setLoading]=useState(false);

    async function submit(){

        setError("");

        if(name.trim().split(/\s+/).length<3){

            setError("اكتب الاسم الثلاثي كامل.");

            return;
        }

        if(!email || !studentNumber || !parentNumber || !password){

            setError("املأ كل البيانات.");

            return;
        }

        if(password.length<6){

            setError("الباسورد لازم يكون 6 أحرف أو أرقام على الأقل.");

            return;
        }

        setLoading(true);

        try{

            const existing =
            await supabase
            .from("students")
            .select("id")
            .eq("student_number",studentNumber)
            .maybeSingle();

            if(existing.data){

                setError("رقم الطالب مستخدم بالفعل.");

                setLoading(false);

                return;
            }

            const {data,error} =
            await supabase.auth.signUp({

                email:email.trim(),
                password:password

            });

            if(error)
                throw error;

            if(!data.user)
                throw new Error("لم يتم إنشاء الحساب.");

            const code=genCode();

            const insert =
            await supabase
            .from("students")
            .insert({

                id:data.user.id,
                full_name:name.trim(),
                student_number:studentNumber.trim(),
                parent_number:parentNumber.trim(),
                student_code:code

            });

            if(insert.error)
                throw insert.error;

            alert(
                "تم إنشاء الحساب بنجاح. لو طلب منك تأكيد الإيميل، افتح رسالة Supabase في بريدك."
            );

            navigate("login");

        }catch(e){

            setError(e.message || "حدث خطأ أثناء إنشاء الحساب.");

        }

        setLoading(false);
    }

    return(
        <div className="max-w-md mx-auto px-5 py-12">

            <h2 className="text-3xl font-extrabold text-center mb-7">
                إنشاء حساب طالب
            </h2>

            <div
                className="rounded-2xl p-6"
                style={{
                    background:"#FDFBF4"
                }}
            >

                <Field
                    label="الاسم الثلاثي"
                    value={name}
                    onChange={e=>setName(e.target.value)}
                />

                <Field
                    label="الإيميل"
                    type="email"
                    value={email}
                    onChange={e=>setEmail(e.target.value)}
                />

                <Field
                    label="رقم الطالب"
                    value={studentNumber}
                    onChange={e=>setStudentNumber(e.target.value)}
                />

                <Field
                    label="رقم ولي الأمر"
                    value={parentNumber}
                    onChange={e=>setParentNumber(e.target.value)}
                />

                <Field
                    label="الباسورد"
                    type="password"
                    value={password}
                    onChange={e=>setPassword(e.target.value)}
                />

                {error && (
                    <p
                        className="font-bold text-sm mb-4"
                        style={{color:"#E85C41"}}
                    >
                        {error}
                    </p>
                )}

                <Button
                    className="w-full"
                    disabled={loading}

                >

                </Button>

}

function Login({onLogin,navigate}){

    const [email,setEmail]=useState("");
    const [password,setPassword]=useState("");

    const [error,setError]=useState("");
    const [loading,setLoading]=useState(false);

    async function submit(){

        setError("");
        setLoading(true);

        const {data,error} =
        await supabase.auth.signInWithPassword({

            email:email.trim(),
            password

        });

        if(error){

            setError("الإيميل أو الباسورد غير صحيح.");

            setLoading(false);

            return;
        }

        onLogin(data.user);

        setLoading(false);
    }

    return(
        <div className="max-w-md mx-auto px-5 py-14">

            <h2 className="text-3xl font-extrabold text-center mb-7">
                دخول الطالب

                style={{background:"#FDFBF4"}}
            >

                <Field
                    label="الإيميل"
                    type="email"
                    value={email}
                    onChange={e=>setEmail(e.target.value)}
                />

                <Field
                    label="الباسورد"
                    type="password"
                    value={password}
                    onChange={e=>setPassword(e.target.value)}
                    onKeyDown={e=>{
                        if(e.key==="Enter") submit();
                    }}
                />

                {error && (
                    <p
                        className="font-bold text-sm mb-4"
                        style={{color:"#E85C41"}}
                    >
                        {error}
                    </p>
                )}

                <Button
                    className="w-full"
                    disabled={loading}
                    onClick={submit}
                >
                    {loading ? "جاري الدخول..." : "دخول"}
                </Button>

                <button
                    onClick={()=>navigate("signup")}
                    className="block mx-auto mt-5 font-bold"
                    style={{color:"#3E6E8E"}}
                >
                    إنشاء حساب جديد
                </button>

            </div>

        </div>
    );
}
