function genCode(){
    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    let s = "";
    for(let i=0;i<8;i++){
        if(i===4) s+="-";
        s += chars[Math.floor(Math.random()*chars.length)];
    }
    return "EF-"+s;
}

/* =====================================================

function Signup({ go, onDone }){
    const [name,setName]=useState("");
    const [email,setEmail]=useState("");
    const [studentNumber,setStudentNumber]=useState("");
    const [parentNumber,setParentNumber]=useState("");
    const [password,setPassword]=useState("");
    const [loading,setLoading]=useState(false);
    const [error,setError]=useState("");
    const [success,setSuccess]=useState("");

    async function submit(){
        setError(""); setSuccess("");

        if(name.trim().split(/\s+/).length < 3){
            setError("اكتب الاسم الثلاثي كاملًا");
            return;
        }
        if(!email.trim() || !studentNumber.trim() || !parentNumber.trim() || !password){
            setError("املأ كل البيانات");
            return;
        }
        if(password.length < 6){
            setError("الباسورد لازم يكون 6 حروف أو أرقام على الأقل");
            return;
        }

        setLoading(true);
        try{
            const { data: authData, error: authError } = await supabase.auth.signUp({
                email: email.trim(), password
            });
            if(authError) throw authError;
            if(!authData.user) throw new Error("لم يتم إنشاء الحساب");

            const { error: studentError } = await supabase.from("students").insert({
                id: authData.user.id,
                full_name: name.trim(),
                student_number: studentNumber.trim(),
                parent_number: parentNumber.trim(),
                student_code: genCode(),
                email: email.trim()
            });
            if(studentError) throw studentError;

            if(authData.session){
                onDone(authData.user);
            } else {
                setSuccess("تم إنشاء الحساب بنجاح. افتح رسالة تأكيد الإيميل ثم سجل الدخول.");
            }
        } catch(e){
            setError(e.message || "حصل خطأ أثناء إنشاء الحساب");
        } finally {
            setLoading(false);
        }
    }

    return (
        <div className="max-w-md mx-auto px-5 py-12">
            <h2 className="text-3xl font-extrabold text-center font-cairo mb-7">حساب جديد</h2>
            <div className="rounded-2xl p-6" style={{ background:"#FDFBF4", border:"1px solid rgba(22,48,42,.12)" }}>
                <Field label="الاسم الثلاثي" value={name} onChange={e=>setName(e.target.value)} placeholder="مثال: أحمد محمد علي" />
                <Field label="الإيميل" type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="example@gmail.com" />
                <Field label="رقم الطالب" value={studentNumber} onChange={e=>setStudentNumber(e.target.value)} />
                <Field label="رقم ولي الأمر" value={parentNumber} onChange={e=>setParentNumber(e.target.value)} />
                <Field label="الباسورد" type="password" value={password} onChange={e=>setPassword(e.target.value)} />
                {error && <p className="text-sm font-bold mb-4" style={{ color:"#E85C41" }}>{error}</p>}
                {success && <p className="text-sm font-bold mb-4" style={{ color:"#4C8C63" }}>{success}</p>}
                <Button className="w-full" disabled={loading} onClick={submit}>
                    {loading ? "جاري إنشاء الحساب..." : "إنشاء الحساب"}
                </Button>
                <button onClick={()=>go("login")} className="block w-full mt-5 text-sm font-bold" style={{ color:"#3E6E8E" }}>
                    عندك حساب؟ سجل دخولك
                </button>
            </div>
        </div>
    );
}

/* =====================================================
   STUDENT DASHBOARD
===================================================== */

function StudentDashboard({ student, lessons, access, onRefresh }){
    const [codes,setCodes]=useState({});
    const [message,setMessage]=useState("");
    const [active,setActive]=useState(null);
    const [videoUrl,setVideoUrl]=useState(null);
    const [videoLoading,setVideoLoading]=useState(false);

    async function redeem(lesson){
        setMessage("");
        const value = (codes[lesson.id] || "").trim();
        if(!value){
            setMessage("اكتب الكود أولًا");
            return;
        }

        const { data, error } = await supabase.rpc("redeem_lesson_code", {
            p_code: value,
            p_lesson_id: lesson.id
        });

        if(error || !data || !data.success){
            setMessage((data && data.message) || "حصل خطأ، حاول مرة تانية");
            return;
        }

        setMessage("تم فتح الحصة ✓");
        setCodes({ ...codes, [lesson.id]: "" });
        await onRefresh();
    }

    async function complete(lesson){
        await supabase
            .from("lesson_access")
            .update({ status: "completed" })
            .eq("student_id", student.id)
            .eq("lesson_id", lesson.id);
        await onRefresh();
    }

    async function openLesson(lesson){
        setActive(lesson);
        setVideoUrl(null);
        setVideoLoading(true);
        const { data, error } = await supabase.rpc("get_lesson_video", { p_lesson_id: lesson.id });
        setVideoLoading(false);
        if(!error) setVideoUrl(data);
    }

    if(active){
        const item = access.find(x => x.lesson_id === active.id);
        return (
            <div className="max-w-4xl mx-auto px-5 py-10">
                <button onClick={()=>{ setActive(null); setVideoUrl(null); }} className="mb-6 font-bold">← رجوع</button>

                <div className="rounded-2xl p-6 mb-5" style={{ background:"#16302A" }}>
                    <h2 className="text-2xl font-extrabold text-white font-cairo">{active.title}</h2>
                    <p className="text-white/70 mt-2">{active.description}</p>
                </div>

                <div className="rounded-2xl overflow-hidden p-4" style={{ background:"#FDFBF4" }}>
                    {videoLoading && <div className="text-center font-bold py-10">جاري تجهيز الفيديو...</div>}
                    {!videoLoading && videoUrl && (
                        <video controls className="w-full rounded-xl" src={videoUrl} />
                    )}
                    {!videoLoading && !videoUrl && (
                        <div className="p-10 text-center font-bold">محتوى الحصة هيتضاف قريبًا من الأستاذ.</div>
                    )}
                </div>

                {item?.status !== "completed" && (
                    <div className="mt-6">
                        <Button variant="accent" onClick={()=>complete(active)}>✅ أنهيت الحصة</Button>
                    </div>
                )}
            </div>
        );
    }

    return (
        <div className="max-w-4xl mx-auto px-5 py-10">
            <h2 className="text-3xl font-extrabold font-cairo">أهلاً {student.full_name.split(" ")[0]} 👋</h2>
            <p className="mt-2 mb-8" style={{ color:"#6B675C" }}>
                كود الطالب: <b>{student.student_code}</b>
            </p>

            {message && (
                <div className="rounded-xl p-3 mb-5 font-bold" style={{ background:"#FDFBF4", border:"1px solid rgba(22,48,42,.15)" }}>
                    {message}
                </div>
            )}

            <div className="grid gap-4">
                {lessons.map(lesson => {
                    const item = access.find(x => x.lesson_id === lesson.id);
                    const status = item?.status || "locked";
                    return (
                        <div key={lesson.id} className="rounded-2xl p-5" style={{ background:"#FDFBF4", border:"1px solid rgba(22,48,42,.12)" }}>
                            <h3 className="text-lg font-bold font-cairo">
                                {status==="locked" ? "🔒" : status==="completed" ? "✅" : "🔓"} {lesson.title}
                            </h3>
                            <p className="text-sm mt-1" style={{ color:"#6B675C" }}>{lesson.description}</p>

                            {status==="locked" && (
                                <div className="flex gap-2 mt-4">
                                    <input
                                        value={codes[lesson.id] || ""}
                                        onChange={e=>setCodes({ ...codes, [lesson.id]: e.target.value })}
                                        placeholder="كود الحصة"
                                        className="flex-1 rounded-xl px-4 py-2 outline-none"
                                        style={{ background:"#F7F3E8", border:"1px solid rgba(22,48,42,.2)" }}
                                    />
                                    <Button variant="accent" onClick={()=>redeem(lesson)}>🔑 فتح</Button>
                                </div>
                            )}

                            {(status==="unlocked" || status==="completed") && (
                                <div className="mt-4">
                                    <Button onClick={()=>openLesson(lesson)}>▶ دخول الحصة</Button>
                                </div>
                            )}
                        </div>
                    );
                })}
                {lessons.length===0 && <p className="text-center font-bold py-10">مفيش حصص مضافة حاليًا.</p>}
            </div>
        </div>
    );
}

/* =====================================================
   ADMIN DASHBOARD
===================================================== */

function AdminDashboard({ onRefresh, settings, onSettingsSaved }){
    const [title,setTitle]=useState("");
    const [description,setDescription]=useState("");
    const [videoFile,setVideoFile]=useState(null);
    const [uploading,setUploading]=useState(false);

    const [lessons,setLessons]=useState([]);
    const [students,setStudents]=useState([]);
    const [allAccess,setAllAccess]=useState([]);
    const [allCodes,setAllCodes]=useState([]);
    const [openStudent,setOpenStudent]=useState(null);

    const [message,setMessage]=useState("");
    const [loadingStudents,setLoadingStudents]=useState(false);

    const [localSettings,setLocalSettings]=useState(settings);
    const [settingsLoading,setSettingsLoading]=useState(false);

    async function loadLessons(){
        const { data, error } = await supabase.from("lessons").select("*").order("created_at", { ascending:true });
        if(!error) setLessons(data || []);
    }

    async function loadStudents(){
        setLoadingStudents(true);
        const { data, error } = await supabase.from("students").select("*").order("created_at", { ascending:false });
        if(error){
            setMessage("خطأ في تحميل الطلاب: " + error.message);
        } else {
            setStudents(data || []);
        }

        const { data: accessData } = await supabase.from("lesson_access").select("*");
        setAllAccess(accessData || []);

        const { data: codesData } = await supabase.from("lesson_codes").select("*").eq("used", false);
        setAllCodes(codesData || []);

        setLoadingStudents(false);
    }

    useEffect(() => {
        loadLessons();
        loadStudents();
    }, []);

    async function addLesson(){
        setMessage("");
        if(!title.trim()){
            setMessage("اكتب عنوان الحصة");
            return;
        }
        if(!videoFile){
            setMessage("اختار ملف الفيديو");
            return;
        }

        setUploading(true);
        try{
            const path = `${Date.now()}_${videoFile.name}`;
            const { error: uploadError } = await supabase.storage
                .from("lesson-videos")
                .upload(path, videoFile);
            if(uploadError) throw uploadError;

            const { data: urlData } = supabase.storage.from("lesson-videos").getPublicUrl(path);

            const { error: insertError } = await supabase.from("lessons").insert({
                title: title.trim(),
                description: description.trim(),
                video_url: urlData.publicUrl
            });
            if(insertError) throw insertError;

            setTitle(""); setDescription(""); setVideoFile(null);
            setMessage("تمت إضافة الحصة ✓");
            await loadLessons();
            await onRefresh();
        } catch(e){
            setMessage("حصل خطأ أثناء رفع الفيديو أو إضافة الحصة: " + e.message);
        } finally {
            setUploading(false);
        }
    }

    async function deleteLesson(id){
        if(!confirm("هل أنت متأكد من حذف هذه الحصة؟")) return;
        const { error } = await supabase.from("lessons").delete().eq("id", id);
        if(error){
            alert("حصل خطأ أثناء الحذف: " + error.message);
            return;
        }
        await loadLessons();
        await loadStudents();
        await onRefresh();
    }

    async function generateCode(studentId, lessonId){
        const { error } = await supabase.from("lesson_codes").insert({
            code: genCode(),
            lesson_id: lessonId,
            student_id: studentId,
            used: false
        });
        if(error){
            alert("حصل خطأ أثناء إنشاء الكود: " + error.message);
            return;
        }
        await loadStudents();
    }

    async function openAccess(studentId, lessonId){
        const { error } = await supabase.from("lesson_access").upsert({
            student_id: studentId, lesson_id: lessonId, status: "unlocked"
        }, { onConflict: "student_id,lesson_id" });
        if(error){ alert("حصل خطأ: " + error.message); return; }
        await loadStudents();
    }

    async function closeAccess(studentId, lessonId){
        const { error } = await supabase.from("lesson_access").upsert({
            student_id: studentId, lesson_id: lessonId, status: "locked"
        }, { onConflict: "student_id,lesson_id" });
        if(error){ alert("حصل خطأ: " + error.message); return; }
        await loadStudents();
    }

    async function saveSettings(){
        setSettingsLoading(true);
        const { error } = await supabase.from("platform_store").upsert({ id: 1, content: localSettings });
        setSettingsLoading(false);
        if(error){
            setMessage("حصل خطأ في حفظ الإعدادات: " + error.message);
            return;
        }
        setMessage("تم حفظ إعدادات المنصة ✓");
        onSettingsSaved(localSettings);
    }

    return (
        <div className="max-w-6xl mx-auto px-5 py-10">
            <h2 className="text-3xl font-extrabold font-cairo mb-8">لوحة تحكم الأدمن ⚙️</h2>

            {message && (
                <div className="rounded-xl p-4 mb-6 font-bold" style={{ background:"#FDFBF4", border:"1px solid rgba(22,48,42,.15)" }}>
                    {message}
                </div>
            )}

            {/* SETTINGS */}
            <div className="rounded-2xl p-6 mb-8" style={{ background:"#FDFBF4", border:"1px solid rgba(22,48,42,.12)" }}>
                <h3 className="text-xl font-bold mb-5">⚙️ إعدادات المنصة</h3>
                <Field label="اسم المنصة" value={localSettings.title} onChange={e=>setLocalSettings({ ...localSettings, title:e.target.value })} />
                <Field label="العنوان الرئيسي" value={localSettings.subtitle} onChange={e=>setLocalSettings({ ...localSettings, subtitle:e.target.value })} />
                <Field label="الوصف" value={localSettings.description} onChange={e=>setLocalSettings({ ...localSettings, description:e.target.value })} />
                <Field label="رقم التواصل" value={localSettings.phone} onChange={e=>setLocalSettings({ ...localSettings, phone:e.target.value })} />
                <Button variant="accent" disabled={settingsLoading} onClick={saveSettings}>
                    {settingsLoading ? "جاري الحفظ..." : "💾 حفظ الإعدادات"}
                </Button>
            </div>

            {/* ADD LESSON */}
            <div className="rounded-2xl p-6 mb-8" style={{ background:"#FDFBF4", border:"1px solid rgba(22,48,42,.12)" }}>
                <h3 className="text-xl font-bold mb-5">➕ إضافة حصة</h3>
                <Field label="عنوان الحصة" value={title} onChange={e=>setTitle(e.target.value)} placeholder="Present Simple" />
                <Field label="الوصف" value={description} onChange={e=>setDescription(e.target.value)} />
                <label className="block mb-4">
                    <span className="block text-sm font-bold mb-1">ملف الفيديو</span>
                    <input
                        type="file"
                        accept="video/*"
                        onChange={e=>setVideoFile(e.target.files[0] || null)}
                        className="w-full rounded-xl px-4 py-3"
                        style={{ border:"1px solid rgba(22,48,42,.2)", background:"#FDFBF4" }}
                    />
                </label>
                <Button onClick={addLesson} disabled={uploading}>
                    {uploading ? "جاري رفع الفيديو..." : "➕ إضافة الحصة"}
                </Button>
            </div>

            {/* STUDENTS + PER-STUDENT ACCESS & CODES */}
            <div className="rounded-2xl p-6 mb-8" style={{ background:"#FDFBF4", border:"1px solid rgba(22,48,42,.12)" }}>
                <div className="flex justify-between items-center mb-5">
                    <h3 className="text-xl font-bold">👨‍🎓 الطلاب ({students.length})</h3>
                    <Button variant="outline" onClick={loadStudents}>🔄 تحديث</Button>
                </div>

                {loadingStudents && <p className="font-bold">جاري تحميل الطلاب...</p>}
                {!loadingStudents && students.length===0 && <p className="font-bold">لا يوجد طلاب مسجلين حتى الآن.</p>}

                <div className="grid gap-3">
                    {students.map(student => (
                        <div key={student.id} className="rounded-2xl p-4" style={{ background:"#EEF0EA", border:"1px solid rgba(22,48,42,.1)" }}>
                            <button className="w-full flex justify-between items-center text-right" onClick={()=>setOpenStudent(openStudent===student.id ? null : student.id)}>
                                <div>
                                    <p className="font-bold">{student.full_name}</p>
                                    <p className="text-xs" style={{ color:"#6B675C" }}>
                                        رقم الطالب: {student.student_number} — كود الحساب: {student.student_code}
                                    </p>
                                </div>
                                <span>{openStudent===student.id ? "▾" : "‹"}</span>
                            </button>

                            {openStudent===student.id && (
                                <div className="mt-4 pt-4 grid gap-3" style={{ borderTop:"1px dashed rgba(22,48,42,.2)" }}>
                                    <p className="text-xs" style={{ color:"#6B675C" }}>
                                        📧 {student.email} — 📞 ولي الأمر: {student.parent_number}
                                    </p>
                                    {lessons.map(lesson => {
                                        const item = allAccess.find(x => x.student_id===student.id && x.lesson_id===lesson.id);
                                        const status = item?.status || "locked";
                                        const codes = allCodes.filter(c => c.student_id===student.id && c.lesson_id===lesson.id);
                                        return (
                                            <div key={lesson.id} className="rounded-xl p-3 flex flex-col md:flex-row md:items-center justify-between gap-2" style={{ background:"#FDFBF4" }}>
                                                <div>
                                                    <p className="font-bold text-sm">{lesson.title}</p>
                                                    <p className="text-xs" style={{ color: status==="locked" ? "#E85C41" : "#4C8C63" }}>
                                                        {status==="locked" ? "🔒 مقفولة" : status==="completed" ? "✅ مكتملة" : "🔓 مفتوحة"}
                                                    </p>
                                                    {codes.length > 0 && (
                                                        <p className="text-xs mt-1" style={{ color:"#3E6E8E" }}>
                                                            كود جاهز: <b>{codes[0].code}</b>
                                                        </p>
                                                    )}
                                                </div>
                                                <div className="flex gap-2 flex-wrap">
                                                    <Button variant="outline" onClick={()=>generateCode(student.id, lesson.id)}>🔑 كود جديد</Button>
                                                    <Button variant="accent" onClick={()=>openAccess(student.id, lesson.id)}>🔓 فتح مباشر</Button>
                                                    <Button variant="danger" onClick={()=>closeAccess(student.id, lesson.id)}>🔒 قفل</Button>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            )}
                        </div>
                    ))}
                </div>
            </div>

            {/* LESSONS LIST */}
            <div>
                <h3 className="text-xl font-bold mb-4">📚 الحصص الحالية</h3>
                <div className="grid gap-3">
                    {lessons.map(l => (
                        <div key={l.id} className="rounded-xl p-4 flex justify-between items-center gap-3" style={{ background:"#FDFBF4", border:"1px solid rgba(22,48,42,.12)" }}>
                            <div>
                                <p className="font-bold">{l.title}</p>
                                <p className="text-sm" style={{ color:"#6B675C" }}>{l.description}</p>
                            </div>
                            <button onClick={()=>deleteLesson(l.id)} className="font-bold" style={{ color:"#E85C41" }}>حذف 🗑️</button>
                        </div>
                    ))}
                </div>
            </div>
        </div>
    );
}

/* =====================================================
   APP
===================================================== */

const DEFAULT_SETTINGS = {
    title: "English Elfishawy",
    subtitle: "اتعلم English بطريقة أذكى",
    description: "دروس اللغة الإنجليزية الخاصة بـ Mr. Mostafa Elfishawy",
    phone: "01000000000"
};

function App(){
    const [page,setPage]=useState("home");
    const [user,setUser]=useState(null);
    const [student,setStudent]=useState(null);
    const [lessons,setLessons]=useState([]);
    const [access,setAccess]=useState([]);
    const [settings,setSettings]=useState(DEFAULT_SETTINGS);
    const [loading,setLoading]=useState(true);
    const [admin,setAdmin]=useState(false);
    const [changingPassword,setChangingPassword]=useState(false);

    async function loadSettings(){
        const { data, error } = await supabase.from("platform_store").select("content").eq("id", 1).maybeSingle();
        if(!error && data?.content){
            setSettings({ ...DEFAULT_SETTINGS, ...data.content });
        }
    }

    async function loadData(currentUser){
        const { data: lessonData, error: lessonError } = await supabase
            .from("public_lessons")
            .select("*")
            .order("created_at", { ascending:true });
        if(!lessonError) setLessons(lessonData || []);

        if(currentUser){
            const { data: studentData } = await supabase.from("students").select("*").eq("id", currentUser.id).maybeSingle();
            setStudent(studentData || null);

            const { data: accessData } = await supabase.from("lesson_access").select("*").eq("student_id", currentUser.id);
            setAccess(accessData || []);
        } else {
            setStudent(null);
            setAccess([]);
        }
    }

    async function refresh(){
        await loadData(user);
    }

    async function loginDone(u){
        setUser(u);
        const isAdmin = u?.email?.toLowerCase() === ADMIN_EMAIL.toLowerCase();
        setAdmin(isAdmin);
        setPage(isAdmin ? "admin" : "student");
        await loadData(u);
    }

    async function logout(){
        await supabase.auth.signOut();
        setUser(null);
        setStudent(null);
        setAdmin(false);
        setChangingPassword(false);
        setPage("home");
    }

    useEffect(() => {
        let mounted = true;

        async function start(){
            await loadSettings();
            const { data: { session } } = await supabase.auth.getSession();
            if(!mounted) return;

            if(session?.user){
                setUser(session.user);
                const isAdmin = session.user.email?.toLowerCase() === ADMIN_EMAIL.toLowerCase();
                setAdmin(isAdmin);
                setPage(isAdmin ? "admin" : "student");
                await loadData(session.user);
            } else {
                await loadData(null);
            }
            if(mounted) setLoading(false);
        }

        start();

        const { data: { subscription } } = supabase.auth.onAuthStateChange(async (event, session) => {
            if(!mounted) return;

            if(event === "PASSWORD_RECOVERY"){
                setChangingPassword(true);
                setPage("password");
                setLoading(false);
                return;
            }

            if(session?.user){
                setUser(session.user);
                const isAdmin = session.user.email?.toLowerCase() === ADMIN_EMAIL.toLowerCase();
                setAdmin(isAdmin);
                if(!changingPassword){
                    setPage(isAdmin ? "admin" : "student");
                }
                await loadData(session.user);
            } else {
                setUser(null);
                setStudent(null);
                setAdmin(false);
                if(event === "SIGNED_OUT") setPage("home");
            }
        });

        return () => {
            mounted = false;
            subscription.unsubscribe();
        };
    }, []);

    function passwordUpdated(){
        setChangingPassword(false);
        setPage("login");
        setUser(null);
        setAdmin(false);
        setStudent(null);
        supabase.auth.signOut();
    }

    if(loading){
        return (
            <div className="min-h-screen flex items-center justify-center font-bold text-lg" style={{ background:"#EEF0EA", color:"#16302A" }}>
                جاري تحميل المنصة...
            </div>
        );
    }

    return (
        <div className="min-h-screen">
            <Header user={user} onLogout={logout} onHome={()=>setPage("home")} settings={settings} />

            {page==="home" && <Landing go={setPage} settings={settings} />}
            {page==="signup" && <Signup go={setPage} onDone={loginDone} />}
            {page==="login" && <Login go={setPage} onDone={loginDone} />}
            {page==="password" && <UpdatePassword onDone={passwordUpdated} />}

            {page==="student" && user && !admin && student && (
                <StudentDashboard student={student} lessons={lessons} access={access} onRefresh={refresh} />
            )}

            {page==="student" && user && !admin && !student && (
                <div className="max-w-md mx-auto px-5 py-20 text-center">
                    <h2 className="text-2xl font-bold font-cairo mb-3">الحساب موجود لكن بيانات الطالب ناقصة</h2>
                    <p>تواصلي مع الإدارة لإكمال بيانات الحساب.</p>
                </div>
            )}

            {page==="admin" && user && admin && (
                <AdminDashboard
                    onRefresh={refresh}
                    settings={settings}
                    onSettingsSaved={(s)=>setSettings(s)}
                />
            )}

            <footer className="text-center py-10 text-sm font-bold" style={{ color:"#6B675C" }}>
                {settings.title} © 2026
            </footer>
        </div>
    );
}

/* =====================================================
   START
===================================================== */

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

</script>

</body>
</html>
